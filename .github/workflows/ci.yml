name: CI

# The factory's own gate. One command per job:
#   test          — installer + asset-tree (node:test, no language toolchain)
#   rust-gates    — rust jalon: just rust-lint / rust-check (test/fixtures/rust-gate)
#
# Language jobs are separate so a red toolchain names itself. Local `npm test`
# skips those files when the toolchain is missing; the rust job sets RUST_GATES=1
# so a missing tool is a failure, never a skip-as-pass.
#
# The eval harness (eval/run.mjs) is deliberately NOT here: it calls the `claude`
# CLI and spends real tokens. It is a model-bump check, run on demand — see the
# eval job below (workflow_dispatch only) and eval/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_eval:
        description: 'Also run the agent eval harness (spends tokens)'
        type: boolean
        default: false
      model:
        description: 'Model to evaluate (e.g. a candidate alias)'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUST_VERSION: '1.42.4'
  CARGO_DENY_VERSION: '0.20.2'
  CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
  CARGO_MACHETE_VERSION: '0.9.2'
  CARGO_MACHETE_SHA256: '48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  rust-gates:
    runs-on: ubuntu-latest
    env:
      RUST_GATES: '1'
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Ensure just
        run: |
          command -v just >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | bash -s -- --tag "$JUST_VERSION" --to /usr/local/bin
      - name: Install cargo-deny and cargo-machete
        run: |
          mkdir -p "$HOME/.local/bin"
          deny_tar="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$deny_tar" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny_tar}"
          echo "${CARGO_DENY_SHA256}  ${deny_tar}" | sha256sum --check --strict
          tar -xzf "$deny_tar" --strip-components=1 -C "$HOME/.local/bin" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          machete_tar="cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$machete_tar" \
            "https://github.com/bnjbvr/cargo-machete/releases/download/v${CARGO_MACHETE_VERSION}/${machete_tar}"
          echo "${CARGO_MACHETE_SHA256}  ${machete_tar}" | sha256sum --check --strict
          tar -xzf "$machete_tar" --strip-components=1 -C "$HOME/.local/bin" \
            "cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          chmod +x "$HOME/.local/bin/cargo-deny" "$HOME/.local/bin/cargo-machete"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch the advisory database
        working-directory: kit/rust
        run: cargo deny fetch db
      - name: just rust-lint / rust-check (witness crate)
        run: node --test test/rust-gates.test.mjs

  # The single required check (rules/cicd/pipeline.md): protecting the matrix job
  # directly means a renamed or skipped leg silently counts as green.
  ci-ok:
    if: always()
    needs: [test, rust-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate must have actually succeeded
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "✗ a required gate did not succeed ($r)"; exit 1; }
          done

  eval:
    # Manual only: each case invokes `claude` headlessly and costs tokens.
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Run the agent regression harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node eval/run.mjs ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
