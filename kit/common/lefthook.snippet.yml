# Common hooks — MERGE into the repo's root lefthook.yml. Install: lefthook install
#
# One trigger, and it is the only one kit/common gets: review-guard is the sole gate
# here cheap enough to be a hook — pure Node, no LLM, milliseconds. Everything else
# (adr-check, docs-check) rides inside `just check`, and the review itself costs
# minutes, so it stays a per-block command like mutate-diff.
#
# pre-push and NEVER pre-commit: a review's cadence is per push, and what the guard
# defends is the moment code leaves the machine with an unanswered CRITICAL in the
# report. No glob — a verdict is about the branch, not about a file type.
# Doctrine: rules/agent/autonomy.md.

pre-push:
  parallel: true
  commands:
    review-guard:
      run: just review-guard
