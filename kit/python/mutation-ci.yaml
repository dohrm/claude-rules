name: Mutation (Python)

# Tier 4 quality gate: are the tests meaningful, or do they just execute code
# without asserting? Coverage says nothing about this; mutation score does. This
# is the gate that lets AI-written unit tests be trusted without reading every
# assertion by hand. Doctrine: rules/testing/ratchet.md.
#
# THIS JOB IS THE GATE. Mutation left the agent's pre-push loop, so
# surfacing survivors here is the design rather than a sign the local loop was
# skipped. `just python-mutate` stays available to buy back a round trip on code
# you doubt — an optimisation, never a step owed before pushing.
#
# HOW IT SCOPES, and why it is not the Rust job: mutmut has no diff mode — no
# `--in-diff` like cargo-mutants, no `--since`. It is path-scoped, so the job
# below computes the PR's changed source files and passes them to
# `--paths-to-mutate`. Consequence to know: mutation is measured on the files you
# touched, not on the hunks — a large file with a two-line change still mutates
# whole. Narrow `source_paths` in pyproject.toml if that gets slow.
#
# CALIBRATION PHASE: this job is NON-BLOCKING ON ITS FINDINGS on purpose — mutmut
# has no built-in threshold flag, and `mutmut run` exits 0 whatever survives, non-zero
# only when the run itself failed. First establish a baseline, triage real
# gaps vs equivalent mutants, THEN decide what number you defend — and enforce it
# in the last step rather than by hand. Never a round number: see the ratchet rule.
# Never `continue-on-error` on the job: it also greens a crash or a cancelled run.
#
# COPY to .gitea/workflows/mutation-python.yaml (or .github/workflows/). The
# syntax is the same on both; ADAPT `runs-on` (Gitea: your runner label, e.g.
# `linux`; GitHub: `ubuntu-latest`) and working-directory to your python_dir.
#
# Needs kit/common imported by the root justfile: the PR's base comes from `ci-base`.
#
# One-time setup: `uv add --dev mutmut`, then the [tool.mutmut] section from
# pyproject.snippet.toml. Add `.mutmut-cache` and `mutants/` to .gitignore.

on:
  pull_request:
    branches:
      - main
      - 'rfc/**'   # L4 phase PRs merge on this proof (rules/agent/autonomy.md § L4)

env:
  JUST_VERSION: '1.42.4'               # ADAPT / bump deliberately

jobs:
  mutation:
    # The `rfc/<slug>` → default-branch PR is not mutated again: each phase was, against
    # `rfc/<slug>`, and those runs are the proof (rules/agent/autonomy.md § L4).
    # An `if:` rather than a trigger filter, so the PR shows the job skipped, not missing.
    if: ${{ !(startsWith(github.head_ref, 'rfc/') && github.base_ref == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest             # ADAPT to your runner label
    timeout-minutes: 120               # ADAPT once you know your numbers — bounded by default
    defaults:
      run:
        working-directory: .           # ADAPT to your python_dir (e.g. services/api)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # need the base branch to compute the diff

      - name: Ensure just
        run: |
          command -v just >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | bash -s -- --tag "$JUST_VERSION" --to /usr/local/bin

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked          # fails if uv.lock drifted from pyproject.toml

      - name: Compute changed source files
        id: changed
        env:
          BASE: ${{ github.base_ref }}   # the PR's target branch (kit/common ci-base)
        run: |
          base="$(just ci-base)"         # fetched in full; a failed fetch fails the step
          # `|| true` per grep: no match is no file, not a failure under pipefail (Gitea's default)
          FILES=$(git diff --name-only --diff-filter=d "$base...HEAD" \
                  | { grep -E '\.py$' || true; } | { grep -v -E '(^|/)(tests?|conftest)' || true; } | paste -sd, -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Mutating: ${FILES:-<none>}"

      - name: Mutation testing (changed files only)
        if: steps.changed.outputs.files != ''
        run: uv run mutmut run --paths-to-mutate "${{ steps.changed.outputs.files }}"

      - name: Surviving mutants
        if: always() && steps.changed.outputs.files != ''
        # The part worth reading: each survivor is a mutation no test noticed.
        # Locally, `uv run mutmut browse` is the interactive triage view.
        run: uv run mutmut results

# ---------------------------------------------------------------------------
# Nightly full sweep (enable when ready): track the score over time and catch
# erosion outside changed files.
#   on:
#     schedule:
#       - cron: '0 3 * * *'
#   then run: uv run mutmut run   ([tool.mutmut] source_paths still scopes it)
# ---------------------------------------------------------------------------
