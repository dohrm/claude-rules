name: Mutation

# Tier 4 quality gate: are the tests meaningful, or do they just execute code
# without asserting? Coverage says nothing about this; mutation score does. This
# is the gate that lets AI-written unit tests be trusted without reading every
# assertion by hand.
#
# Runs on PR against changed code only (`--in-diff`) so it stays minutes, not
# hours. Scoping/exclusions live in .cargo/mutants.toml (I/O crates, getters).
#
# THIS JOB IS THE GATE. It is not a witness of a local run: mutation
# left the agent's pre-push loop because it was measured at ~19 minutes on a
# 65-mutant diff, and its remaining lever is `-j` — cores a laptop cannot spend
# while the editor and the agent are using them. A runner can. Surfacing survivors
# here is the design, not a sign the local loop was skipped; `just rust-mutate`
# stays available to buy back a round trip on code you doubt.
#
# THE RANGE IS THE PR'S. The job calls `just rust-mutate` — the same recipe as a local
# run, one definition — with `base` from kit/common's `ci-base`: the PR's own target
# branch, fetched in full. A phase PR into `rfc/<slug>` mutates that phase only, not
# the phases already merged there. A failed fetch fails the step, and rust-mutate
# refuses an empty range rather than mutating nothing and passing.
#
# Because this is the gate, the compiler cache below is PART OF IT, not a tuning
# option: the same workspace took 972 s of baseline build cold and 113 s with
# sccache warm. A cold runner turns this job from minutes into a quarter of an
# hour, and a slow gate is one somebody eventually removes.
#
# DISK. Each `-j` job builds its own copy of the workspace, so `mutate_jobs` multiplies
# disk, not just CPU (rust.just). The target dir stays in the workspace: a
# CARGO_TARGET_DIR outside it outlives the job on a persistent runner, one per
# workflow, until the disk is full — and kit/rust/cargo-config.snippet.toml says why a
# shared one is wrong anyway. What persists between runs is sccache's cache, which
# SCCACHE_CACHE_SIZE bounds.
#
# CALIBRATION PHASE: this job is NON-BLOCKING ON ITS FINDINGS on purpose — the
# mutation step tolerates cargo-mutants' survivor and timeout exits, nothing else. A
# healthy repo often sits ~70% (below a naive 0.75 bar). First establish
# per-crate baselines, triage real gaps vs equivalent mutants, THEN flip to
# blocking with a ratcheted threshold ("no lower than baseline"). Never
# `continue-on-error` on the job: it also greens a failed baseline or a run killed
# before its first mutant, which measured nothing.
#
# COPY to .gitea/workflows/mutation.yaml (or .github/workflows/). ADAPT `runs-on`,
# `timeout-minutes`, `RUSTC_WRAPPER` and the report path to your CI and rust_dir.
# Needs kit/common (`ci-base`) and kit/rust imported by the root justfile.
# WINDOWS CI: set runs-on to your windows label and add `shell: bash` to the
# `run:` steps below (git-bash ships on Windows runners), or rewrite them in
# PowerShell. cargo-mutants itself runs fine on Windows.

on:
  pull_request:
    branches:
      - main
      - 'rfc/**'   # L4 phase PRs merge on this proof (rules/agent/autonomy.md § L4)

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  JUST_VERSION: '1.42.4'               # ADAPT / bump deliberately

jobs:
  mutation:
    # The `rfc/<slug>` → default-branch PR is not mutated again: each phase was, against
    # `rfc/<slug>`, and those runs are the proof (rules/agent/autonomy.md § L4). Mutating
    # the whole RFC once more was measured at 1,240 mutants, killed at the 3 h limit.
    # An `if:` rather than a trigger filter, so the PR shows the job skipped, not missing.
    if: ${{ !(startsWith(github.head_ref, 'rfc/') && github.base_ref == github.event.repository.default_branch) }}
    runs-on: linux                     # ADAPT to your runner label
    # ADAPT once you know your numbers. Bounded by default: an unbounded run went
    # 5 h 17 on hosted runners and spent the account's whole Actions quota.
    timeout-minutes: 120
    # WIRE THIS. On a persistent runner a shared compiler cache is what keeps this gate
    # in minutes — measured 972 s → 113 s of baseline build. The value is a path on
    # YOUR runner, so it stays a placeholder, but skipping it is not the neutral choice
    # it looks like. An ephemeral runner has no warm cache: give it a persistent one,
    # or expect the cold numbers.
    # env:
    #   RUSTC_WRAPPER: sccache            # or the absolute path on your runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # HEAD's history: the diff starts at its merge base
          token: ${{ secrets.CI_TOKEN }}

      - name: Ensure just
        run: |
          command -v just >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | bash -s -- --tag "$JUST_VERSION" --to /usr/local/bin

      # Prefer baking cargo-mutants into the runner image; this is the fallback.
      - name: Ensure cargo-mutants
        run: command -v cargo-mutants >/dev/null 2>&1 || cargo install cargo-mutants --locked

      - name: Mutation testing (the PR's diff against its base)
        env:
          BASE: ${{ github.base_ref }}   # the PR's target branch (kit/common ci-base)
        # CALIBRATION ONLY: cargo-mutants exits 2 on survivors and 3 on timeouts — findings,
        # tolerated while the baseline is measured. Any other exit stays red. Once
        # ratcheted, drop the last line and `|| rc=$?`: this is the gate.
        run: |
          base="$(just ci-base)"         # fetched in full; a failed fetch fails the step
          rc=0; just base="$base" mutate_jobs=2 rust-mutate || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]

      # upload-artifact@v4 fails on Gitea (GHESNotSupportedError) and v3 no longer runs
      # on github.com: one step per forge.
      - name: Upload mutation report (github.com)
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out/           # ADAPT: <rust_dir>/mutants.out/

      - name: Upload mutation report (Gitea)
        if: always() && github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: mutants-out
          path: mutants.out/           # ADAPT: <rust_dir>/mutants.out/

# ---------------------------------------------------------------------------
# Nightly full sweep (enable when ready): track the score over time and catch
# erosion outside changed lines.
#   on:
#     schedule:
#       - cron: '0 3 * * *'
#   then run: cargo mutants --no-shuffle -j 2   (config still scopes out I/O;
#   raise -j only with the disk for one workspace copy per job — see DISK above)
# ---------------------------------------------------------------------------
