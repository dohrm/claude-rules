# golangci-lint v2 — COPY to <go_dir>/.golangci.yml. The installer never merges
# it. Read by `just go-lint`. Map: .dev/kit/go/README.md.
#
# v1 schema (`gofmt` under linters.enable, `gosimple` as its own linter) will
# not parse. `golangci-lint migrate` converts an old file you already own.

version: "2"

linters:
  enable:
    - errcheck      # unhandled errors
    - govet
    - staticcheck   # SA* / S1* / QF* — gosimple folded in
    - unused
    - gosec         # security anti-patterns

formatters:
  enable:
    - gofmt

# No `//nolint` without a reason on the same line.
