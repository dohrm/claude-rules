# golangci-lint v2 — COPY to <go_dir>/.golangci.yml. The installer never merges
# it. Read by `just go-lint`. Map: .dev/kit/go/README.md.
#
# v1 schema (`gofmt` under linters.enable, `gosimple` as its own linter) will
# not parse. `golangci-lint migrate` converts an old file you already own.

version: "2"

linters:
  enable:
    - errcheck      # unhandled errors
    - govet
    - staticcheck   # SA* / S1* / QF* — gosimple folded in
    - unused
    - gosec         # security anti-patterns
    # Resource lifecycle and context — each one a rule in rules/go/ a machine checks.
    - bodyclose     # http.Response.Body closed
    - sqlclosecheck # sql.Rows / Stmt closed
    - rowserrcheck  # rows.Err() checked after the loop
    - noctx         # outbound HTTP and DB calls carry a context
    - contextcheck  # a function given a ctx passes it on, not context.Background()
    - containedctx  # no context.Context stored in a struct
    - errorlint     # %w when wrapping; errors.Is / errors.As, never == or a type switch
    - nilerr        # `return nil` right after `if err != nil`
    - exhaustive    # a switch on an enum names every value — `default` does not count

formatters:
  enable:
    - gofmt

# No `//nolint` without a reason on the same line.
