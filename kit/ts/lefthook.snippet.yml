# TypeScript language-floor hooks — MERGE into the repo's root lefthook.yml.
#
# Thin triggers only: commands live in the justfile recipes (ts-lint / ts-check).
# A React portal uses the ts-web / ts-tauri snippet instead; a Fastify service
# uses the ts-node snippet.

pre-commit:
  parallel: true
  commands:
    ts:
      glob: "**/*.{ts,tsx}"
      run: just ts-lint

pre-push:
  parallel: true
  commands:
    ts:
      glob: "**/*.{ts,tsx}"
      run: just ts-check
