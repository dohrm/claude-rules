name: Mutation (TS)

# Tier 4 quality gate: are the tests meaningful, or do they just execute code
# without asserting? Coverage says nothing about this; mutation score does. This
# is the gate that lets AI-written unit tests be trusted without reading every
# assertion by hand. Doctrine: rules/testing/ratchet.md.
#
# Runs on PR against changed files only so it stays minutes, not hours.
#
# THIS JOB IS THE GATE. Mutation left the agent's pre-push loop, so
# surfacing survivors here is the design rather than a sign the local loop was
# skipped. `just ts-mutate` stays available to buy back a round trip on code you
# doubt. Stryker has no `--since`, so the two scope differently — locally
# `--incremental` (reuses the previous report and re-tests what changed), here
# `--mutate` on the PR's changed files, which needs no prior state on a fresh
# runner. Same verdict, different starting point.
#
# CALIBRATION PHASE: this job is NON-BLOCKING ON ITS FINDINGS on purpose — with
# `thresholds.break` unset (null, the default), Stryker exits 0 whatever survives,
# and non-zero only when the run itself failed. First establish a baseline, triage
# real gaps vs equivalent mutants, THEN set `thresholds.break` in
# stryker.config.json to the measured baseline. Never a round number — see the
# ratchet rule. Never `continue-on-error` on the job: it also greens a crash or a
# cancelled run, which measured nothing.
#
# COPY to .gitea/workflows/mutation-ts.yaml (or .github/workflows/). The syntax
# is the same on both; ADAPT `runs-on` (Gitea: your runner label, e.g. `linux`;
# GitHub: `ubuntu-latest`) and the working-directory to your ts_dir.
#
# Needs kit/common imported by the root justfile: the PR's base comes from `ci-base`.
#
# One-time setup in the frontend/package root:
#   npm i -D @stryker-mutator/core @stryker-mutator/vitest-runner   # or the jest runner
#   npx stryker init      # then commit stryker.config.json
# In stryker.config.json, exclude what mutation cannot judge:
#   "mutate": ["src/**/*.{ts,tsx}", "!src/api/generated/**", "!src/**/*.test.{ts,tsx}",
#              "!src/**/*.stories.tsx", "!src/main.tsx"]

on:
  pull_request:
    branches:
      - main
      - 'rfc/**'   # L4 phase PRs merge on this proof (rules/agent/autonomy.md § L4)

env:
  CI: 'true'
  JUST_VERSION: '1.42.4'               # ADAPT / bump deliberately

jobs:
  mutation:
    # The `rfc/<slug>` → default-branch PR is not mutated again: each phase was, against
    # `rfc/<slug>`, and those runs are the proof (rules/agent/autonomy.md § L4).
    # An `if:` rather than a trigger filter, so the PR shows the job skipped, not missing.
    if: ${{ !(startsWith(github.head_ref, 'rfc/') && github.base_ref == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest             # ADAPT to your runner label
    timeout-minutes: 120               # ADAPT once you know your numbers — bounded by default
    defaults:
      run:
        working-directory: .           # ADAPT to your ts_dir (e.g. apps/web)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0               # need the base branch to compute the diff

      - name: Ensure just
        run: |
          command -v just >/dev/null 2>&1 || \
            curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
              | bash -s -- --tag "$JUST_VERSION" --to /usr/local/bin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Compute changed files
        id: changed
        env:
          BASE: ${{ github.base_ref }}   # the PR's target branch (kit/common ci-base)
        run: |
          base="$(just ci-base)"         # fetched in full; a failed fetch fails the step
          FILES=$(git diff --name-only --diff-filter=d "$base...HEAD" \
                  | grep -E '\.(ts|tsx)$' | grep -v -E '(\.test\.|/generated/)' | paste -sd, -)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Mutating: ${FILES:-<none>}"

      - name: Mutation testing (changed files only)
        if: steps.changed.outputs.files != ''
        run: npx stryker run --mutate "${{ steps.changed.outputs.files }}" --reporters clear-text,html

      # upload-artifact@v4 fails on Gitea (GHESNotSupportedError) and v3 no longer runs
      # on github.com: one step per forge.
      - name: Upload mutation report (github.com)
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: reports/mutation/      # ADAPT: <ts_dir>/reports/mutation/

      - name: Upload mutation report (Gitea)
        if: always() && github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: stryker-report
          path: reports/mutation/      # ADAPT: <ts_dir>/reports/mutation/

# ---------------------------------------------------------------------------
# Nightly full sweep (enable when ready): track the score over time and catch
# erosion outside changed files.
#   on:
#     schedule:
#       - cron: '0 3 * * *'
#   then run: npx stryker run   (stryker.config.json still scopes `mutate`)
# ---------------------------------------------------------------------------
